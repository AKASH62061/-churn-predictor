<!DOCTYPE html>
<html>
<head>
    <title>Churn Prediction</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 40px;">

    <div style="max-width: 600px; margin: auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 15px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">Churn Prediction Form</h2>
        <form method="POST" action="/predict">

            <label>Total Charges:</label><br>
            <input type="number" step="0.01" name="TotalCharges" required style="width: 100%; padding: 10px; margin-bottom: 10px;"><br>

            <label>Monthly Charges:</label><br>
            <input type="number" step="0.01" name="MonthlyCharges" required style="width: 100%; padding: 10px; margin-bottom: 10px;"><br>

            <label>Contract Type:</label><br>
            <select name="Contract" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="Month-to-month">Month-to-month</option>
                <option value="Other">Other</option>
            </select><br>

            <label>Internet Service:</label><br>
            <select name="InternetService" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="Fiber optic">Fiber optic</option>
                <option value="Other">Other</option>
            </select><br>

            <label>Payment Method:</label><br>
            <select name="PaymentMethod" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="Electronic check">Electronic check</option>
                <option value="Other">Other</option>
            </select><br>

            <label>Multiple Lines:</label><br>
            <select name="MultipleLines" required style="width: 100%; padding: 10px; margin-bottom: 10px;">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select><br>

            <label>Online Backup:</label><br>
            <select name="OnlineBackup" required style="width: 100%; padding: 10px; margin-bottom: 20px;">
                <option value="No">No</option>
                <option value="Yes">Yes</option>
            </select><br>

            <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; font-size: 16px;">
                Predict Churn
            </button>
        </form>

        {% if prediction_text %}
            <p style="text-align: center; margin-top: 20px; font-weight: bold;">{{ prediction_text }}</p>
        {% endif %}
    </div>

</body>
</html>
